<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EproPos</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#1f1a17">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- iPhone: "Ekranga qo'shish" qilinganda Safari'siz, alohida oynada ochiladi -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EproPos">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <div id="print-area"></div>
  <script src="/app.js"></script>
  <script>
    // app.js yuklanmasa (juda eski brauzer) - bo'sh oq ekran o'rniga tushuntirish
    setTimeout(function () {
      if (window.__eproposLoaded) return;
      document.getElementById("app").innerHTML =
        '<div style="padding:32px;font-family:sans-serif;text-align:center;color:#2b2420">' +
        '<h2>EproPos ochilmadi</h2>' +
        '<p>Brauzeringiz juda eski. Qurilmani yangilang (Sozlamalar → Umumiy → Dasturiy ta\'minotni yangilash)' +
        ' yoki boshqa brauzerdan foydalaning.</p>' +
        '<p style="color:#8a7f76;font-size:13px">' + navigator.userAgent + '</p></div>';
    }, 4000);
  </script>
</body>
</html>
