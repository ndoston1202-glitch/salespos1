name: iPhone ilova

on:
  push:
    branches: [main, claude/github-connection-ntol3x]
    paths:
      - "ios/**"
      - "static/**"
      - "*.py"
      - "version.json"
      - "android/app/src/main/python/mobile_main.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Briefcase
        run: python -m pip install briefcase==0.3.23

      - name: Dastur fayllarini ilovaga joylash
        run: |
          CORE=ios/src/epropos/core
          mkdir -p "$CORE"
          cp server.py sync.py telegram.py tunnel.py xlsx.py version.json android/app/src/main/python/mobile_main.py "$CORE/"
          cp -R static "$CORE/static"
          VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" ios/pyproject.toml
          grep '^version' ios/pyproject.toml

      - name: Xcode loyihasini yaratish
        working-directory: ios
        run: briefcase create iOS --no-input

      # Imzosiz yig'iladi - AltStore/Sideloadly o'rnatishda foydalanuvchining Apple ID si bilan imzolaydi
      - name: iPhone uchun yig'ish
        working-directory: ios
        run: |
          xcodebuild build -project build/epropos/ios/xcode/EproPos.xcodeproj -configuration Release \
            -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet
          APP=$(find build/epropos/ios/xcode -type d -name "EproPos.app" -path "*Release-iphoneos*" | head -1)
          echo "App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../EproPos.ipa Payload)
          ls -la EproPos.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EproPos-ipa
          path: ios/EproPos.ipa

      # Doimiy havolalar: .../releases/download/ios-latest/EproPos.ipa va altstore.json (AltStore manbasi)
      - name: Release'ga joylash
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python ios/altstore.py ios/EproPos.ipa out
          cp ios/EproPos.ipa out/
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --title "EproPos iPhone ilovasi" \
              --notes "iPhone uchun EproPos. AltStore'ga manba qo'shing: https://github.com/${{ github.repository }}/releases/download/ios-latest/altstore.json (yoki EproPos.ipa ni Sideloadly bilan o'rnating)." \
              --target "$GITHUB_SHA"
          fi
          gh release upload ios-latest out/EproPos.ipa out/altstore.json out/version.json --clobber
