name: Android APK

on:
  push:
    branches: [main, claude/github-connection-ntol3x]
    paths:
      - "android/**"
      - "static/**"
      - "*.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy (ilova ichidagi Python) yig'ish uchun xuddi shu versiyadagi Python kerak
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testlar
        run: python -m unittest discover tests

      - name: APK yig'ish
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk EproPos.apk
          ls -la EproPos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EproPos-apk
          path: android/EproPos.apk

      # Doimiy havola: https://github.com/<repo>/releases/download/android-latest/EproPos.apk
      - name: Release'ga joylash
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "EproPos Android ilovasi" \
              --notes "Telefon uchun EproPos. EproPos.apk ni yuklab, o'rnating. Ilova internetsiz va kompyutersiz ham ishlaydi; kompyuter bilan bitta Wi-Fi'da bo'lganda ma'lumotlar sinxronlanadi." \
              --target "$GITHUB_SHA"
          fi
          gh release upload android-latest android/EproPos.apk --clobber
